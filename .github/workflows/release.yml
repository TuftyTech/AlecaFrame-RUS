name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: существующий тег, для которого собрать (или пересобрать) релиз, например v0.5.0
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: сборка и релиз
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # тег на красном коммите не должен попасть к игрокам
      - name: pnpm test
        run: pnpm test

      - name: версия тега совпадает с package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$TAG" ] || { echo "::error::тег $TAG, а в package.json $version"; exit 1; }

      # Имя архива без версии: ссылка releases/latest/download/AlecaFrame-RUS.zip в README
      # всегда ведёт на свежую сборку. Внутри только то, что нужно установщику.
      - name: AlecaFrame-RUS.zip
        run: |
          set -eu
          dir=stage/AlecaFrame-RUS
          mkdir -p "$dir"
          cp -r Install.cmd Uninstall.cmd Start.cmd windows dist package.json LICENSE README.md "$dir/"
          (cd stage && zip -qr -X ../AlecaFrame-RUS.zip AlecaFrame-RUS)
          sha256sum AlecaFrame-RUS.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AlecaFrame-RUS.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" AlecaFrame-RUS.zip SHA256SUMS.txt \
              --title "AlecaFrame-RUS $TAG" --notes-file .github/release-notes.md --latest
          fi
